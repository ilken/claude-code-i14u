# tmux.conf — Optimized for Claude Code Team Mode
# Installed to ~/.tmux.conf by setup.sh

# Enable mouse for scrolling and clicking panes
set -g mouse on

# Start window/pane numbering at 1 (easier to reach)
set -g base-index 1
setw -g pane-base-index 1

# Increase scrollback buffer (great for Verbose mode)
set -g history-limit 50000

# Improve colors for Claude's output
set -g default-terminal "screen-256color"
